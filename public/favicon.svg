<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="neuGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1d9e6"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#cbd5e1"/>
      <feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#ffffff"/>
    </filter>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Neumorphic Rounded Square -->
  <rect x="10" y="10" width="80" height="80" rx="24" fill="#eef2f7" filter="url(#softShadow)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Search Node Icon -->
  <circle cx="44" cy="44" r="18" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="57" y1="57" x2="72" y2="72" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- SEO Pulse Node -->
  <circle cx="44" cy="44" r="7" fill="#3b82f6"/>
</svg>
