    <script>
      // Automatically keep canonical link synced with current host/domain
      try {
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical && window.location.origin) {
          canonical.href = window.location.origin + window.location.pathname;
        }
      } catch (err) {}

      // Compatibility shim for browser extensions monkey-patching window.fetch
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          });
        } catch (err) {}

        // Suppress extension-originated unhandled exceptions
        window.addEventListener('error', function(e) {
          if (e && e.filename && (e.filename.includes('chrome-extension://') || e.filename.includes('moz-extension://'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
